<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pixel Bounce</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #060e20;
        color: #fff;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .box {
        text-align: center;
      }
      h1 {
        color: #22c55e;
      }
      p {
        color: #94a3b8;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.25rem;
        background: #22c55e;
        color: #060e20;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Pixel Bounce</h1>
      <p>Placeholder puzzle — keep the orb alive.</p>
      <button id="bounce" type="button">Bounce</button>
      <p id="lives">Lives: 3</p>
    </div>
    <script>
      let lives = 3;
      const el = document.getElementById('lives');
      document.getElementById('bounce').addEventListener('click', () => {
        lives = Math.max(0, lives - 0);
        el.textContent = 'Lives: ' + lives + ' · Bounce!';
      });
    </script>
  </body>
</html>

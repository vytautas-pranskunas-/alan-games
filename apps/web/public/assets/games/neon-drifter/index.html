<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neon Drifter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a16;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .box {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: #94a3b8;
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.25rem;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        color: #0a0a16;
        font-weight: 700;
        cursor: pointer;
      }
      #score {
        margin-top: 1rem;
        font-family: monospace;
        color: #22d3ee;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Neon Drifter</h1>
      <p>Placeholder browser game — press boost!</p>
      <button id="boost" type="button">Boost</button>
      <div id="score">SCORE // 0</div>
    </div>
    <script>
      let score = 0;
      const el = document.getElementById('score');
      document.getElementById('boost').addEventListener('click', () => {
        score += 100;
        el.textContent = 'SCORE // ' + score.toLocaleString();
      });
    </script>
  </body>
</html>
